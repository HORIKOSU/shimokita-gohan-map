<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>下北沢ご飯マップ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%9C%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<style>
:root{
  --bg:#fbf6ee; --card:#ffffff; --ink:#2f2a24; --sub:#8a8074; --line:#ece3d4;
  --accent:#e0692f; --accent-soft:#fbe3d3;
  --visited:#e0692f; --want:#c9962b; --want-bg:#fdf3d9; --none-bg:#f1ede4; --none-ink:#948b7c;
  --c-noodle:#d64545; --c-curry:#b98324; --c-izakaya:#8b5cf6; --c-bar:#2a78d6;
  --c-cafe:#1baf7a; --c-chinese:#d6336c; --c-teishoku:#17a2b8; --c-other:#6c757d;
  --shadow: 0 2px 10px rgba(60,40,20,0.08);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:'M PLUS Rounded 1c',-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;}

/* header */
header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;background:var(--card);border-bottom:1px solid var(--line);z-index:20;}
header h1{font-size:17px;margin:0;font-weight:800;display:flex;align-items:center;gap:6px;}
header .hbtns{display:flex;gap:8px;}
.iconbtn{width:36px;height:36px;border-radius:50%;border:none;background:var(--bg);
  display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;}
.iconbtn:active{transform:scale(0.94);}

/* search/filter bar */
.filterbar{flex:0 0 auto;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;gap:6px;overflow-x:auto;z-index:15;}
.filterbar::-webkit-scrollbar{display:none;}
.chipsel{flex:0 0 auto;padding:6px 12px;border-radius:16px;border:1px solid var(--line);
  background:var(--bg);font-size:12.5px;color:var(--sub);white-space:nowrap;cursor:pointer;font-family:inherit;}
.chipsel.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;}
.searchrow{flex:0 0 auto;padding:6px 12px 10px;background:var(--card);display:flex;gap:8px;}
.searchrow input{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;
  font-family:inherit;background:var(--bg);color:var(--ink);}
.searchrow select{border:1px solid var(--line);border-radius:10px;padding:8px 8px;font-size:12.5px;
  font-family:inherit;background:var(--bg);color:var(--ink);}

/* main views */
#views{flex:1 1 auto;position:relative;overflow:hidden;}
.view{position:absolute;inset:0;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch;}
.view.show{display:block;}
#mapView{overflow:hidden;}
#leafletMap{position:absolute;inset:0;}

.legend{position:absolute;left:8px;bottom:10px;background:rgba(255,255,255,0.95);border-radius:10px;
  padding:8px 10px;font-size:10.5px;color:var(--sub);box-shadow:var(--shadow);z-index:400;line-height:1.6;max-width:150px;}
.legend b{color:var(--ink);}
.legdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle;}

#locateBtn{position:absolute;right:10px;top:10px;width:42px;height:42px;border-radius:50%;border:none;
  background:rgba(255,255,255,0.95);box-shadow:var(--shadow);font-size:19px;z-index:450;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--ink);}
#locateBtn:active{transform:scale(0.94);}
#locateBtn:disabled{opacity:0.6;}
.mylocmarker{width:16px;height:16px;border-radius:50%;background:#4285F4;border:3px solid #fff;
  box-shadow:0 0 0 1px rgba(0,0,0,0.25),0 1px 4px rgba(0,0,0,0.35);}

/* marker clustering */
.marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{background:rgba(224,105,47,0.25);}
.marker-cluster-small div,.marker-cluster-medium div,.marker-cluster-large div{
  background:var(--accent);color:#fff;font-weight:800;font-family:inherit;}
.marker-cluster{width:36px !important;height:36px !important;margin-left:-18px !important;margin-top:-18px !important;}
.marker-cluster div{width:30px;height:30px;margin-left:3px;margin-top:3px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:12px;}
.marker-cluster span{line-height:1;}

/* list view */
.arealist{padding:10px 12px 90px;}
.areacard{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;}
.areacard h3{margin:0;padding:10px 14px;font-size:13.5px;font-weight:800;background:var(--accent-soft);
  color:#8a3a13;display:flex;justify-content:space-between;}
.chipwrap{padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;}
.chip{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:14px;font-size:12.5px;
  border:1px solid var(--line);background:var(--none-bg);color:var(--none-ink);cursor:pointer;font-family:inherit;}
.chip.visited{background:var(--visited);color:#fff;border-color:var(--visited);font-weight:700;}
.chip.want{background:var(--want-bg);color:#8a6b12;border-color:var(--want);font-weight:700;}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 1.5px #fff;flex:0 0 auto;vertical-align:middle;}

/* stats view */
.statwrap{padding:14px 14px 90px;}
.hero{background:linear-gradient(135deg,#f6935a,#e0692f);color:#fff;border-radius:16px;padding:18px;
  margin-bottom:14px;box-shadow:var(--shadow);}
.hero .big{font-size:34px;font-weight:800;}
.hero .lbl{font-size:12px;opacity:0.9;}
.tilerow{display:flex;gap:8px;margin-bottom:14px;}
.tile{flex:1;background:var(--card);border-radius:12px;padding:10px;text-align:center;box-shadow:var(--shadow);}
.tile .n{font-size:20px;font-weight:800;color:var(--accent);}
.tile .l{font-size:10.5px;color:var(--sub);}
.barrow{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px;}
.barrow .lb{width:110px;flex:0 0 auto;color:var(--sub);}
.barrow .track{flex:1;height:8px;background:var(--none-bg);border-radius:4px;overflow:hidden;}
.barrow .fill{height:100%;background:var(--accent);}
.barrow .val{width:34px;text-align:right;color:var(--sub);font-size:11px;}
.statwrap h4{font-size:13px;margin:16px 0 8px;color:var(--sub);}

/* bottom tabs */
#tabbar{flex:0 0 auto;display:flex;background:var(--card);border-top:1px solid var(--line);z-index:20;}
.tab{flex:1;text-align:center;padding:9px 0 7px;font-size:11px;color:var(--sub);cursor:pointer;font-family:inherit;
  background:none;border:none;}
.tab .ti{font-size:19px;display:block;}
.tab.active{color:var(--accent);font-weight:700;}

/* FAB */
#fab{position:fixed;right:16px;bottom:74px;width:52px;height:52px;border-radius:50%;background:var(--accent);
  color:#fff;font-size:26px;border:none;box-shadow:0 4px 14px rgba(224,105,47,0.45);z-index:500;cursor:pointer;}
#fab:active{transform:scale(0.95);}

/* sheets */
.backdrop{position:fixed;inset:0;background:rgba(30,20,10,0.35);z-index:900;display:none;}
.backdrop.show{display:block;}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;
  max-height:82vh;overflow-y:auto;z-index:901;display:none;padding:18px 18px 26px;box-shadow:0 -4px 20px rgba(0,0,0,0.15);}
.sheet.show{display:block;}
.sheet h2{font-size:16px;margin:0 0 4px;font-weight:800;}
.sheet .genre{font-size:12px;color:var(--sub);margin-bottom:10px;}
.sheet .infoline{font-size:12.5px;color:var(--sub);margin:3px 0;line-height:1.5;}
#sheetX{position:fixed;z-index:902;width:32px;height:32px;border-radius:50%;background:#fff;border:1px solid var(--line);
  display:none;align-items:center;justify-content:center;font-size:15px;color:var(--sub);cursor:pointer;box-shadow:var(--shadow);}
.actrow{display:flex;gap:8px;margin:14px 0 10px;flex-wrap:wrap;}
.actbtn{flex:1;min-width:100px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);
  font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit;text-align:center;}
.actbtn.on{background:var(--visited);color:#fff;border-color:var(--visited);}
.actbtn.wanton{background:var(--want-bg);color:#8a6b12;border-color:var(--want);}
.actbtn.link{background:var(--accent-soft);color:#8a3a13;text-decoration:none;display:flex;align-items:center;justify-content:center;}
.stars{display:flex;gap:4px;margin:8px 0;}
.star{font-size:24px;color:#ddd;cursor:pointer;}
.star.on{color:var(--want);}
.gplace{margin-top:12px;padding:12px;background:var(--bg);border-radius:12px;font-size:12.5px;}
.gplace .rate{font-size:20px;font-weight:800;color:#e2a92a;}
.gplace button{margin-top:6px;padding:7px 12px;border-radius:8px;border:none;background:var(--accent);color:#fff;
  font-size:12px;font-family:inherit;cursor:pointer;}
.gphotos{display:flex;gap:6px;margin-top:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.gphotos img{width:88px;height:66px;object-fit:cover;border-radius:8px;flex:0 0 auto;background:var(--none-bg);}
.formfield{margin-bottom:10px;}
.formfield label{display:block;font-size:11.5px;color:var(--sub);margin-bottom:4px;}
.formfield input,.formfield select,.formfield textarea{width:100%;padding:9px 10px;border:1px solid var(--line);
  border-radius:10px;font-size:13.5px;font-family:inherit;background:var(--bg);color:var(--ink);}
.submitbtn{width:100%;padding:12px;border-radius:12px;border:none;background:var(--accent);color:#fff;
  font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:6px;}
.smallnote{font-size:11px;color:var(--sub);line-height:1.6;margin-top:6px;}
.menuitem{padding:12px 4px;border-bottom:1px solid var(--line);font-size:14px;display:flex;align-items:center;gap:10px;cursor:pointer;}
.menuitem:last-child{border-bottom:none;}
.leaflet-div-icon{background:transparent;border:none;}
.leaflet-tooltip.maptip{display:none;padding:2px 6px;font-size:11px;font-weight:700;color:var(--ink);
  background:rgba(255,255,255,0.92);border:1px solid var(--line);box-shadow:none;}
#leafletMap.show-labels .leaflet-tooltip.maptip{display:block;}
.mappop{min-width:150px;font-family:inherit;}
.mappop-name{font-size:13.5px;font-weight:800;margin-bottom:2px;}
.mappop-sub{font-size:11px;color:var(--sub);margin-bottom:8px;}
.mappop-btns{display:flex;gap:6px;}
.mappop-btns button{flex:1;padding:7px 6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);
  font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer;color:var(--ink);}
.mappop-btns .popwant.on{background:var(--want-bg);color:#8a6b12;border-color:var(--want);}
.mappop-btns .popdetail{background:var(--accent-soft);color:#8a3a13;border-color:var(--accent-soft);}
.leaflet-popup-content{margin:10px 12px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🍜 下北沢ご飯マップ</h1>
    <div class="hbtns">
      <button class="iconbtn" id="btnSettings">⚙️</button>
      <button class="iconbtn" id="btnMenu">☰</button>

  <div id="views">

    <div class="view" id="listView"><div class="arealist" id="listWrap"></div></div>
    <div class="view" id="statsView"><div class="statwrap" id="statsWrap"></div></div>
  </div>

  <button id="fab">＋</button>

  <div id="tabbar">
    <button class="tab active" data-tab="map"><span class="ti">🗺️</span>マップ</button>
    <button class="tab" data-tab="list"><span class="ti">📋</span>リスト</button>
    <button class="tab" data-tab="stats"><span class="ti">📊</span>統計</button>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>
<button id="sheetX">✕</button>

<div class="sheet" id="detailSheet"></div>
<div class="sheet" id="addSheet"></div>
<div class="sheet" id="settingsSheet"></div>
<div class="sheet" id="menuSheet"></div>

<script>
(function(){
"use strict";

var STORE_KEY = "shimokita_gohan_map_v1";
var CATEGORY_LABEL = {
  noodle:"麺・ラーメン", curry:"カレー", izakaya:"居酒屋・酒場・焼鳥焼肉", bar:"バー",
  cafe:"カフェ・喫茶・パン", chinese:"中華・台湾", teishoku:"定食・食堂", other:"その他"
};
var CATEGORY_COLOR = {
  noodle:"#d64545", curry:"#b98324", izakaya:"#8b5cf6", bar:"#2a78d6",
  cafe:"#1baf7a", chinese:"#d6336c", teishoku:"#17a2b8", other:"#6c757d"
};

function loadStore(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(!raw) return {v:1, custom:[], records:{}, hidden:[], apiKey:"", placesCache:{}};
    var d = JSON.parse(raw);
    d.custom = d.custom || []; d.records = d.records || {}; d.hidden = d.hidden || [];
    d.apiKey = d.apiKey || ""; d.placesCache = d.placesCache || {};
    return d;
  }catch(e){ return {v:1, custom:[], records:{}, hidden:[], apiKey:"", placesCache:{}}; }
}
function saveStore(){ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }

var store = loadStore();
var PRESETS = (window.__PRESETS__ || []);
var hiddenSet = {}; (store.hidden||[]).forEach(function(id){hiddenSet[id]=true;});

function allStores(){
  var list = PRESETS.filter(function(p){return !hiddenSet[p.id];});
  return list.concat(store.custom);
}
function getRecord(id){ return store.records[id] || {status:null, rating:0, lastVisit:null}; }
function setRecord(id, patch){
  var r = getRecord(id);
  for(var k in patch) r[k]=patch[k];
  store.records[id]=r; saveStore();
}

/* ---------- state ---------- */
var state = { statusFilter:"all", areaFilter:"all", catFilter:"all", search:"", tab:"map", currentId:null };

/* ---------- filter bar (status) ---------- */
var STATUS_TABS = [
  {key:"all", label:"すべて"}, {key:"visited", label:"✔ 行った"},
  {key:"want", label:"★ 行きたい"}, {key:"none", label:"未訪問"}
];
function renderStatusBar(){
  var el = document.getElementById("statusFilterBar");
  el.innerHTML = "";
  STATUS_TABS.forEach(function(t){
    var b = document.createElement("button");
    b.className = "chipsel" + (state.statusFilter===t.key ? " active":"");
    b.textContent = t.label;
    b.onclick = function(){ state.statusFilter=t.key; renderStatusBar(); renderAll(); };
    el.appendChild(b);
  });
}

function renderCatBar(){
  var el = document.getElementById("catFilterBar");
  el.innerHTML = "";
  var all = document.createElement("button");
  all.className = "chipsel" + (state.catFilter==="all" ? " active":"");
  all.textContent = "ジャンル:すべて";
  all.onclick = function(){ state.catFilter="all"; renderCatBar(); renderAll(); };
  el.appendChild(all);
  Object.keys(CATEGORY_LABEL).forEach(function(k){
    var b = document.createElement("button");
    b.className = "chipsel" + (state.catFilter===k ? " active":"");
    b.innerHTML = '<span class="dot" style="background:'+CATEGORY_COLOR[k]+'"></span> '+CATEGORY_LABEL[k];
    b.onclick = function(){ state.catFilter=k; renderCatBar(); renderAll(); };
    el.appendChild(b);
  });
}

function renderAreaSelect(){
  var sel = document.getElementById("areaFilterSel");
  var areas = {};
  allStores().forEach(function(s){ areas[s.area]=true; });
  var cur = sel.value || "all";
  sel.innerHTML = '<option value="all">エリア:すべて</option>';
  Object.keys(areas).sort().forEach(function(a){
    var o = document.createElement("option"); o.value=a; o.textContent=a; sel.appendChild(o);
  });
  sel.value = cur;
}

function filteredStores(){
  var q = state.search.trim().toLowerCase();
  return allStores().filter(function(s){
    var rec = getRecord(s.id);
    var st = rec.status || "none";
    if(state.statusFilter!=="all" && st!==state.statusFilter) return false;
    if(state.areaFilter!=="all" && s.area!==state.areaFilter) return false;
    if(state.catFilter!=="all" && s.category!==state.catFilter) return false;
    if(q && s.name.toLowerCase().indexOf(q)===-1 && (s.genre||"").toLowerCase().indexOf(q)===-1) return false;
    return true;
  });
}

/* ---------- map ---------- */
var map, markerLayer;
var markersById = {};
var LABEL_ZOOM = 18;
function initMap(){
  map = L.map("leafletMap", {zoomControl:true}).setView([35.6613,139.6683], 16);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom:19, attribution:'&copy; OpenStreetMap contributors'
  }).addTo(map);
  // マーカークラスタリング：店舗が密集していても数字バッジにまとめ、ズームすると自動で分割される
  markerLayer = L.markerClusterGroup({
    maxClusterRadius: 60,
    disableClusteringAtZoom: LABEL_ZOOM,
    showCoverageOnHover: false,
    spiderfyOnMaxZoom: true
  }).addTo(map);
  map.on("zoomend", updateLabelVisibility);
  renderMapLegend();
}
function updateLabelVisibility(){
  var el = document.getElementById("leafletMap");
  if(!map || !el) return;
  if(map.getZoom() >= LABEL_ZOOM) el.classList.add("show-labels");
  else el.classList.remove("show-labels");
}
function statusColorFor(rec){
  var st = rec.status || "none";
  if(st==="visited") return "#e0692f";
  if(st==="want") return "#c9962b";
  return "#bdb4a4";
}
function makeIcon(s, rec){
  var cc = CATEGORY_COLOR[s.category]||"#999";
  var sc = statusColorFor(rec);
  var mark = rec.status==="visited" ? "✔" : (rec.status==="want" ? "★" : "");
  return L.divIcon({
    className:"",
    html:'<div style="position:relative;width:22px;height:22px;">'+
      '<div style="width:22px;height:22px;border-radius:50%;background:'+sc+';border:2.5px solid '+cc+';'+
      'box-shadow:0 1px 4px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;'+
      'color:#fff;font-size:11px;font-weight:800;">'+mark+'</div></div>',
    iconSize:[22,22], iconAnchor:[11,11]
  });
}
function mapPopupHtml(id){
  var s = allStores().filter(function(x){return x.id===id;})[0];
  if(!s) return "";
  var rec = getRecord(id);
  return '<div class="mappop">'+
    '<div class="mappop-name">'+esc(s.name)+'</div>'+
    '<div class="mappop-sub">'+esc(s.genre)+' ・ '+esc(s.area)+'</div>'+
    '<div class="mappop-btns">'+
      '<button class="popwant'+(rec.status==="want"?" on":"")+'" onclick="window.__toggleWantFromMap(\''+id+'\')">★ 行きたい</button>'+
      '<button class="popdetail" onclick="window.__openDetail(\''+id+'\')">詳細を見る</button>'+
    '</div></div>';
}
window.__toggleWantFromMap = function(id){
  var cur = getRecord(id).status;
  setRecord(id, {status: cur==="want" ? null : "want"});
  var s = allStores().filter(function(x){return x.id===id;})[0];
  var m = markersById[id];
  if(m && s){
    m.setIcon(makeIcon(s, getRecord(id)));
    // Note: intentionally NOT calling setPopupContent() here — on this Leaflet build,
    // replacing the content of an OPEN popup causes it to close/destroy itself.
    // Update the already-open popup's button directly instead.
    var isWant = getRecord(id).status === "want";
    var openPopupBtn = document.querySelector(".leaflet-popup .popwant");
    if(openPopupBtn) openPopupBtn.classList.toggle("on", isWant);
  }
  renderList(); renderStats();
};
function renderMap(){
  if(!map) return;
  markerLayer.clearLayers();
  markersById = {};
  filteredStores().forEach(function(s){
    var rec = getRecord(s.id);
    var m = L.marker([s.lat,s.lng], {icon: makeIcon(s,rec)});
    m.bindPopup(mapPopupHtml(s.id), {closeButton:true, maxWidth:220});
    m.bindTooltip(s.name, {permanent:true, direction:"right", offset:[10,0], className:"maptip"});
    markerLayer.addLayer(m);
    markersById[s.id] = m;
  });
  updateLabelVisibility();
}
var myLocMarker=null, myLocCircle=null;
function locateMe(){
  if(!navigator.geolocation){
    alert("この端末・ブラウザは現在地取得に対応していません。");
    return;
  }
  var btn = document.getElementById("locateBtn");
  btn.disabled = true; btn.textContent = "…";
  navigator.geolocation.getCurrentPosition(function(pos){
    btn.disabled = false; btn.textContent = "📍";
    var lat = pos.coords.latitude, lng = pos.coords.longitude, acc = pos.coords.accuracy || 30;
    if(myLocMarker){ map.removeLayer(myLocMarker); myLocMarker=null; }
    if(myLocCircle){ map.removeLayer(myLocCircle); myLocCircle=null; }
    myLocCircle = L.circle([lat,lng], {radius:acc, color:"#4285F4", weight:1, fillColor:"#4285F4", fillOpacity:0.12, interactive:false}).addTo(map);
    myLocMarker = L.marker([lat,lng], {
      icon: L.divIcon({className:"", html:'<div class="mylocmarker"></div>', iconSize:[16,16], iconAnchor:[8,8]}),
      zIndexOffset: 1000, interactive:false
    }).addTo(map);
    map.setView([lat,lng], Math.max(map.getZoom(), 17));
  }, function(err){
    btn.disabled = false; btn.textContent = "📍";
    var msg = "現在地を取得できませんでした。";
    if(err.code === 1) msg += "\nブラウザまたは端末の位置情報アクセスを許可してください。";
    else if(err.code === 3) msg += "\nタイムアウトしました。もう一度お試しください。";
    alert(msg);
  }, {enableHighAccuracy:true, timeout:10000, maximumAge:60000});
}

}

/* ---------- list ---------- */
function cityKeyOf(s){ return s.area || "その他"; }
function renderList(){
  var wrap = document.getElementById("listWrap");
  var list = filteredStores();
  var groups = {};
  list.forEach(function(s){
    var k = cityKeyOf(s);
    (groups[k] = groups[k]||[]).push(s);
  });
  var keys = Object.keys(groups).sort(function(a,b){ return groups[b].length - groups[a].length; });
  if(keys.length===0){ wrap.innerHTML = '<div style="padding:30px;text-align:center;color:var(--sub);font-size:13px;">該当するお店がありません</div>'; return; }
  var html = "";
  keys.forEach(function(k){
    html += '<div class="areacard"><h3>'+esc(k)+' <span>'+groups[k].length+'件</span></h3><div class="chipwrap">';
    groups[k].sort(function(a,b){return a.name.localeCompare(b.name,"ja");}).forEach(function(s){
      var rec = getRecord(s.id);
      var st = rec.status||"none";
      var cls = st==="visited" ? "chip visited" : (st==="want" ? "chip want" : "chip");
      var mark = st==="visited" ? "✔ " : (st==="want" ? "★ " : "");
      html += '<span class="'+cls+'" data-id="'+s.id+'" onclick="window.__openDetail(\''+s.id+'\')">'+
        '<span class="dot" style="background:'+(CATEGORY_COLOR[s.category]||"#999")+'"></span>'+mark+esc(s.name)+'</span>';
    });
    html += '</div></div>';
  });
  wrap.innerHTML = html;
}

/* ---------- stats ---------- */
function renderStats(){
  var wrap = document.getElementById("statsWrap");
  var all = allStores();
  var visited = all.filter(function(s){return (getRecord(s.id).status||"none")==="visited";});
  var want = all.filter(function(s){return (getRecord(s.id).status||"none")==="want";});
  var pct = all.length ? Math.round(visited.length/all.length*100) : 0;

  var byCat = {};
  all.forEach(function(s){ byCat[s.category]=byCat[s.category]||{total:0,visited:0}; byCat[s.category].total++;
    if((getRecord(s.id).status||"none")==="visited") byCat[s.category].visited++; });

  var byArea = {};
  all.forEach(function(s){ var k=s.area; byArea[k]=byArea[k]||{total:0,visited:0}; byArea[k].total++;
    if((getRecord(s.id).status||"none")==="visited") byArea[k].visited++; });

  var favs = all.filter(function(s){ return getRecord(s.id).rating>=4; })
    .sort(function(a,b){ return getRecord(b.id).rating - getRecord(a.id).rating; });

  var html = '<div class="hero"><div class="lbl">下北沢制覇率</div><div class="big">'+pct+'%</div>'+
    '<div class="lbl">'+visited.length+' / '+all.length+' 件 行った</div></div>';
  html += '<div class="tilerow">'+
    '<div class="tile"><div class="n">'+visited.length+'</div><div class="l">✔ 行った</div></div>'+
    '<div class="tile"><div class="n">'+want.length+'</div><div class="l">★ 行きたい</div></div>'+
    '<div class="tile"><div class="n">'+(all.length-visited.length-want.length)+'</div><div class="l">未訪問</div></div>'+
    '</div>';

  html += '<h4>ジャンル別</h4>';
  Object.keys(byCat).sort(function(a,b){return byCat[b].total-byCat[a].total;}).forEach(function(k){
    var d = byCat[k]; var p = d.total? Math.round(d.visited/d.total*100):0;
    html += '<div class="barrow"><div class="lb">'+(CATEGORY_LABEL[k]||k)+'</div>'+
      '<div class="track"><div class="fill" style="width:'+p+'%;background:'+(CATEGORY_COLOR[k]||"#999")+'"></div></div>'+
      '<div class="val">'+d.visited+'/'+d.total+'</div></div>';
  });

  html += '<h4>エリア別</h4>';
  Object.keys(byArea).sort(function(a,b){return byArea[b].total-byArea[a].total;}).forEach(function(k){
    var d = byArea[k]; var p = d.total? Math.round(d.visited/d.total*100):0;
    html += '<div class="barrow"><div class="lb">'+esc(k)+'</div>'+
      '<div class="track"><div class="fill" style="width:'+p+'%"></div></div>'+
      '<div class="val">'+d.visited+'/'+d.total+'</div></div>';
  });

  html += '<h4>お気に入り（★4以上）</h4>';
  if(favs.length===0){ html += '<div class="smallnote">まだありません。詳細シートで★評価をつけてみましょう。</div>'; }
  else { html += '<div class="chipwrap" style="padding:0;">'; favs.slice(0,30).forEach(function(s){
      html += '<span class="chip visited" onclick="window.__openDetail(\''+s.id+'\')">'+esc(s.name)+'</span>';
    }); html += '</div>'; }

  wrap.innerHTML = html;
}

/* ---------- render dispatch ---------- */
function renderAll(){
  renderAreaSelect();
  renderMap();
  renderList();
  renderStats();
}

/* ---------- detail sheet ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function gmapsUrl(s){
  var q = encodeURIComponent(s.name + " " + (s.address||"下北沢"));
  return "https://www.google.com/maps/search/?api=1&query="+q;
}

function openDetail(id){
  if(map) map.closePopup();
  state.currentId = id;
  var s = allStores().filter(function(x){return x.id===id;})[0];
  if(!s) return;
  var rec = getRecord(id);
  var st = rec.status||"none";
  var stars = "";
  for(var i=1;i<=5;i++){ stars += '<span class="star'+(rec.rating>=i?" on":"")+'" data-v="'+i+'">★</span>'; }

  var html = '<h2>'+esc(s.name)+'</h2>';
  html += '<div class="genre"><span class="dot" style="background:'+(CATEGORY_COLOR[s.category]||"#999")+'"></span> '+esc(s.genre)+' ・ '+esc(s.area)+'</div>';
  if(s.address) html += '<div class="infoline">📍 '+esc(s.address)+'</div>';
  if(s.note) html += '<div class="infoline">💬 '+esc(s.note)+'</div>';

  html += '<div class="stars" id="starRow">'+stars+'</div>';

  html += '<div class="actrow">'+
    '<button class="actbtn'+(st==="visited"?" on":"")+'" id="btnVisited">✔ 行った</button>'+
    '<button class="actbtn'+(st==="want"?" wanton":"")+'" id="btnWant">★ 行きたい</button>'+
    '</div>';
  html += '<div class="actrow">'+
    '<a class="actbtn link" href="'+gmapsUrl(s)+'" target="_blank" rel="noopener">🗺️ Googleマップで開く</a>'+
    '</div>';

  html += '<div class="gplace" id="gplaceBox">'+gplaceInitialHtml(id)+'</div>';

  if(store.custom.some(function(c){return c.id===id;})){
    html += '<div class="actrow"><button class="actbtn" id="btnDeleteCustom" style="color:#c0392b;">🗑 このお店を削除</button></div>';
  } else {
    html += '<div class="actrow"><button class="actbtn" id="btnHidePreset">🙈 リストから非表示にする</button></div>';
  }

  document.getElementById("detailSheet").innerHTML = html;
  showSheet("detailSheet");

  document.getElementById("btnVisited").onclick = function(){
    var cur = getRecord(id).status;
    setRecord(id, {status: cur==="visited" ? null : "visited", lastVisit: new Date().toISOString().slice(0,10)});
    openDetail(id); renderAll();
  };
  document.getElementById("btnWant").onclick = function(){
    var cur = getRecord(id).status;
    setRecord(id, {status: cur==="want" ? null : "want"});
    openDetail(id); renderAll();
  };
  document.querySelectorAll("#starRow .star").forEach(function(el){
    el.onclick = function(){
      var v = parseInt(el.getAttribute("data-v"),10);
      var cur = getRecord(id).rating;
      setRecord(id, {rating: cur===v ? 0 : v});
      openDetail(id);
    };
  });
  var delBtn = document.getElementById("btnDeleteCustom");
  if(delBtn) delBtn.onclick = function(){
    if(!confirm("このお店を削除しますか？")) return;
    store.custom = store.custom.filter(function(c){return c.id!==id;});
    delete store.records[id]; saveStore(); hideSheets(); renderAll();
  };
  var hideBtn = document.getElementById("btnHidePreset");
  if(hideBtn) hideBtn.onclick = function(){
    if(!confirm("このお店をリストから非表示にしますか？（メニューから復活できます）")) return;
    store.hidden.push(id); hiddenSet[id]=true; saveStore(); hideSheets(); renderAll();
  };

  maybeFetchGooglePlace(s);
}
window.__openDetail = openDetail;

/* ---------- Google Places integration ---------- */
var googleReady = false;
var placesService = null;
function loadGoogleMapsScript(){
  if(!store.apiKey || googleReady || document.getElementById("gmapsSdk")) return;
  var s = document.createElement("script");
  s.id = "gmapsSdk";
  s.src = "https://maps.googleapis.com/maps/api/js?key="+encodeURIComponent(store.apiKey)+"&libraries=places&callback=__onGmapsReady";
  s.async = true;
  document.head.appendChild(s);
}
window.__onGmapsReady = function(){
  googleReady = true;
  try{ placesService = new google.maps.places.PlacesService(document.createElement("div")); }catch(e){}
};

function gplaceInitialHtml(id){
  var cache = store.placesCache[id];
  if(!store.apiKey){
    return '<div class="smallnote">Google評価の自動表示には⚙️設定からAPIキーの登録が必要です。</div>';
  }
  if(cache){
    return gplaceResultHtml(cache);
  }
  return '<div class="smallnote">Google評価を取得中...</div>';
}
function gplaceResultHtml(cache){
  if(cache.notfound) return '<div class="smallnote">Googleマップ上で該当する店舗情報が見つかりませんでした。</div>';
  var html = '<span class="rate">★ '+(cache.rating!=null?cache.rating:"-")+'</span> ';
  html += '<span style="color:var(--sub);">('+(cache.total||0)+'件のレビュー)</span>';
  if(cache.photos && cache.photos.length){
    html += '<div class="gphotos">';
    cache.photos.forEach(function(url){
      html += '<img src="'+esc(url)+'" loading="lazy" onerror="this.style.display=\'none\'">';
    });
    html += '</div>';
  }
  html += '<div class="smallnote">Google取得: '+cache.ts+'</div>';
  return html;
}
function maybeFetchGooglePlace(s){
  if(!store.apiKey) return;
  var cache = store.placesCache[s.id];
  var hasPhotoField = cache && (cache.notfound || cache.photos !== undefined);
  var fresh = hasPhotoField && (Date.now() - new Date(cache.ts).getTime()) < 1000*60*60*24*30;
  if(fresh) return;
  loadGoogleMapsScript();
  var tries = 0;
  var timer = setInterval(function(){
    tries++;
    if(googleReady && placesService){
      clearInterval(timer);
      placesService.findPlaceFromQuery({
        query: s.name + " " + (s.area||"") + " 下北沢",
        fields: ["place_id","name","rating","user_ratings_total","photos"]
      }, function(results, status){
        var box = document.getElementById("gplaceBox");
        if(status === google.maps.places.PlacesServiceStatus.OK && results && results[0]){
          var r = results[0];
          var photoUrls = [];
          try{
            if(r.photos && r.photos.length){
              photoUrls = r.photos.slice(0,3).map(function(p){
                return p.getUrl({maxWidth:400, maxHeight:300});
              });
            }
          }catch(e){}
          store.placesCache[s.id] = {rating:r.rating, total:r.user_ratings_total, place_id:r.place_id, photos:photoUrls, ts:new Date().toISOString()};
        } else {
          store.placesCache[s.id] = {notfound:true, ts:new Date().toISOString()};
        }
        saveStore();
        if(box && state.currentId===s.id) box.innerHTML = gplaceResultHtml(store.placesCache[s.id]);
      });
    } else if(tries>60){ clearInterval(timer); }
  }, 250);
}

    var genre = document.getElementById("afGenre").value.trim() || CATEGORY_LABEL[cat];
    var area = document.getElementById("afArea").value.trim() || "北口";

/* ---------- menu sheet ---------- */
function openMenu(){
  var html = '<h2>メニュー</h2>';
  html += '<div class="menuitem" id="mnExport">⬇️ データをエクスポート</div>';
  html += '<div class="menuitem" id="mnImport">⬆️ データをインポート</div>';
  html += '<div class="menuitem" id="mnRestore">🙈 非表示にした店を復活</div>';
  html += '<div class="menuitem" id="mnAbout">ℹ️ このツールについて</div>';
  document.getElementById("menuSheet").innerHTML = html;
  showSheet("menuSheet");
  document.getElementById("mnExport").onclick = function(){
    var blob = new Blob([JSON.stringify(store,null,1)], {type:"application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "shimokita_gohan_map_" + new Date().toISOString().slice(0,10) + ".json";
    a.click();
  };
  document.getElementById("mnImport").onclick = function(){
    var inp = document.createElement("input"); inp.type="file"; inp.accept="application/json";

      var f = inp.files[0]; if(!f) return;
      var r = new FileReader();
      r.onload = function(){
        try{
          var d = JSON.parse(r.result);
          store = d; store.custom = store.custom||[]; store.records = store.records||{};
          store.hidden = store.hidden||[]; store.apiKey = store.apiKey||""; store.placesCache = store.placesCache||{};
          hiddenSet = {}; store.hidden.forEach(function(id){hiddenSet[id]=true;});
          saveStore(); hideSheets(); renderAll(); alert("インポートしました");
        }catch(e){ alert("読み込みに失敗しました"); }
      };
      r.readAsText(f);
    };
    inp.click();
  };
  document.getElementById("mnRestore").onclick = function(){
    store.hidden = []; hiddenSet = {}; saveStore(); renderAll(); alert("非表示店舗をすべて復活しました");
  };
  document.getElementById("mnAbout").onclick = function(){
    alert("下北沢ご飯マップ\n\n行った・行きたい・未訪問のお店を地図とリストで管理する個人用ツールです。\n\nプリセット店舗は下北沢エリアのWeb情報をもとに調査したものです。座標は住所・エリア名からの近似配置のため、実際の位置と多少ずれる場合があります。\n\nGoogle評価・写真の自動表示は⚙️設定でAPIキーを登録すると有効になります。\n\n地図右上の📍ボタンで現在地を表示できます（ブラウザの位置情報アクセスの許可が必要です）。");
  };
}

/* ---------- sheets show/hide ---------- */
function showSheet(id){
  document.querySelectorAll(".sheet").forEach(function(s){ s.classList.remove("show"); });
  document.getElementById(id).classList.add("show");
  document.getElementById("backdrop").classList.add("show");
  requestAnimationFrame(positionSheetClose);
}
function hideSheets(){
  document.querySelectorAll(".sheet").forEach(function(s){ s.classList.remove("show"); });
  document.getElementById("backdrop").classList.remove("show");
  document.getElementById("sheetX").style.display = "none";
}
function positionSheetClose(){
  var open = document.querySelector(".sheet.show");
  var x = document.getElementById("sheetX");
  if(!open){ x.style.display="none"; return; }
  var r = open.getBoundingClientRect();
  x.style.display = "flex";
  x.style.top = (r.top + 10) + "px";
  x.style.right = "16px";
  x.style.left = "auto";
}
window.addEventListener("resize", positionSheetClose);
document.getElementById("backdrop").onclick = hideSheets;
document.getElementById("sheetX").onclick = hideSheets;
document.addEventListener("keydown", function(e){ if(e.key==="Escape") hideSheets(); });

/* ---------- tabs ---------- */
document.querySelectorAll(".tab").forEach(function(t){
  t.onclick = function(){
    document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("active");});
    t.classList.add("active");
    var tab = t.getAttribute("data-tab");
    state.tab = tab;
    document.querySelectorAll(".view").forEach(function(v){v.classList.remove("show");});
    document.getElementById(tab+"View").classList.add("show");
    if(tab==="map" && map){ setTimeout(function(){ map.invalidateSize(); }, 50); }
  };
});

/* ---------- top controls ---------- */
document.getElementById("btnSettings").onclick = openSettings;
document.getElementById("btnMenu").onclick = openMenu;
document.getElementById("fab").onclick = openAddSheet;
document.getElementById("locateBtn").onclick = locateMe;
document.getElementById("searchBox").oninput = function(e){ state.search = e.target.value; renderAll(); };
document.getElementById("areaFilterSel").onchange = function(e){ state.areaFilter = e.target.value; renderAll(); };

/* ---------- init ---------- */
renderStatusBar();
renderCatBar();
initMap();
renderAll();
if(store.apiKey) loadGoogleMapsScript();

})();
